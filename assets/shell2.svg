<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200"
     id="svg_root">
  <!-- Rotating group with color‑cycling circle -->
  <g id="rotating" class="color-cycle">
    <circle cx="100" cy="100" r="80" fill="#ff0000">
      <!-- Cycle through hues -->
      <animate attributeName="fill"
               values="#ff0000;#00ff00;#0000ff;#ff0000"
               dur="6s"
               repeatCount="indefinite" />
      <!-- Continuous rotation -->
      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0 100 100"
                        to="360 100 100"
                        dur="10s"
                        repeatCount="indefinite" />
    </circle>
  </g>
</svg>
